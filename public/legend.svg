<svg xmlns="http://www.w3.org/2000/svg" width="480" height="36" viewBox="0 0 480 36" role="img" aria-label="Zabbix severity colours">
  <g font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle" fill="#1f2c33">
    <rect x="0" y="0" width="76" height="36" rx="4" fill="#97AAB3"/>
    <text x="38" y="22">Not classified</text>
    <rect x="80" y="0" width="76" height="36" rx="4" fill="#7499FF"/>
    <text x="118" y="22">Information</text>
    <rect x="160" y="0" width="76" height="36" rx="4" fill="#FFC859"/>
    <text x="198" y="22">Warning</text>
    <rect x="240" y="0" width="76" height="36" rx="4" fill="#FFA059"/>
    <text x="278" y="22">Average</text>
    <rect x="320" y="0" width="76" height="36" rx="4" fill="#E97659"/>
    <text x="358" y="22">High</text>
    <rect x="400" y="0" width="76" height="36" rx="4" fill="#E45959"/>
    <text x="438" y="22">Disaster</text>
  </g>
</svg>
